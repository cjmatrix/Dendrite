      - GOOGLE_CLOUD_PROJECT=nurons-project-502805
      - GOOGLE_CLOUD_LOCATION=us
    env_file:
      - ./backend/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ~/.config/gcloud/application_default_credentials.json:/tmp/gcloud/adc.json:ro
    depends_on:
      - redis
    deploy:
      resources:
        limits:
          cpus: "0.30"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M

  backend-cpu-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dentrites-cpu-worker
    dns:
      - 8.8.8.8
      - 1.1.1.1
