    env_file:
      - ./backend/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - uploads_tmp:/tmp/dendrites-file-uploads
    depends_on:
      - redis
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          cpus: "0.15"
          memory: 192M
