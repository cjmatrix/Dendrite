  redis:
    image: redis:7-alpine
    container_name: redis_dendrites
    restart: always
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    env_file:
      - ./backend/.env
    command: >
      sh -c 'redis-server 
      --requirepass "$$REDIS_PASSWORD" 
      --appendonly yes 
      --maxmemory 256mb 
      --maxmemory-policy noeviction'
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 384M
        reservations:
          cpus: "0.1"
          memory: 128M

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dentrites-backend
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      - "5000:5000"
    environment:
      - REDIS_HOST=redis
      - LOKI_URL=http://loki:3100
      - GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcloud/adc.json
      - GOOGLE_CLOUD_PROJECT=nurons-project-502805
      - GOOGLE_CLOUD_LOCATION=us
    env_file:
      - ./backend/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - uploads_tmp:/tmp/dendrites-file-uploads
      - ~/.config/gcloud/application_default_credentials.json:/tmp/gcloud/adc.json:ro

    depends_on:
      - redis
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          cpus: "0.2"
          memory: 256M

  backend-fast-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dentrites-fast-worker
    dns:
      - 8.8.8.8
      - 1.1.1.1
    command: npm run start:fast-worker
    environment:
      - REDIS_HOST=redis
      - LOKI_URL=http://loki:3100
      - GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcloud/adc.json
      - GOOGLE_CLOUD_PROJECT=nurons-project-502805
      - GOOGLE_CLOUD_LOCATION=us
    env_file:
      - ./backend/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ~/.config/gcloud/application_default_credentials.json:/tmp/gcloud/adc.json:ro
    depends_on:
      - redis
    deploy:
      resources:
        limits:
          cpus: "0.30"
          memory: 384M
        reservations:
          cpus: "0.1"
          memory: 128M

  backend-ai-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dentrites-ai-worker
    dns:
      - 8.8.8.8
      - 1.1.1.1
