services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml 
      - prometheus-data:/prometheus 
    ports:
      - "9090:9090" 
    extra_hosts:
      - "host.docker.internal:host-gateway" 

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    volumes:
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000" 
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin 
    depends_on:
      - prometheus

  qdrant:
    image: qdrant/qdrant:latest
    container_name: dentrites-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage

  redis:
    image: redis:alpine
    container_name: dentrites-redis

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dentrites-backend
    ports:
      - "5000:5000"
    environment:
      - QDRANT_URL=http://qdrant:6333
      - REDIS_HOST=redis
    env_file:
      - ./backend/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - qdrant
      - redis

volumes:
  prometheus-data:
  grafana-data:
  qdrant-data: