

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    volumes:
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    depends_on:
      - prometheus
      - loki
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

  loki:
    image: grafana/loki:latest
    container_name: loki
    restart: unless-stopped
    volumes:
      - loki-data:/loki
    ports:
      - "127.0.0.1:3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    deploy:
      resources:
        limits:
          cpus: "0.15"
          memory: 192M

  redis:
    image: redis:7-alpine
    container_name: redis_dendrites
    restart: always
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    env_file:
      - ./backend/.env
    command: >
      sh -c 'redis-server
      --requirepass "$$REDIS_PASSWORD"
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy noeviction'
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 384M

  backend:
    image: cjmatrix/dentrites-backend:latest
    container_name: dentrites-backend
    restart: always
    dns:
      - 8.8.8.8
      - 1.1.1.1
    expose:
      - "5000"
    environment:
      - REDIS_HOST=redis
      - LOKI_URL=http://loki:3100
      - GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcloud/adc.json
      - GOOGLE_CLOUD_PROJECT=nurons-project-502805
      - GOOGLE_CLOUD_LOCATION=us
    env_file:
      - ./backend/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - uploads_tmp:/tmp/dendrites-file-uploads
      - ./vertex-credentials.json:/tmp/gcloud/adc.json:ro
    depends_on:
      - redis
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M

  backend-fast-worker:
    image: cjmatrix/dentrites-backend:latest
    container_name: dentrites-fast-worker
    restart: always
    dns:
      - 8.8.8.8
      - 1.1.1.1
    command: npm run start:fast-worker
    environment:
      - REDIS_HOST=redis
      - LOKI_URL=http://loki:3100
      - GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcloud/adc.json
      - GOOGLE_CLOUD_PROJECT=nurons-project-502805
      - GOOGLE_CLOUD_LOCATION=us
    env_file:
      - ./backend/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./vertex-credentials.json:/tmp/gcloud/adc.json:ro
    depends_on:
      - redis
    deploy:
      resources:
        limits:
          cpus: "0.30"
          memory: 384M

  backend-ai-worker:
    image: cjmatrix/dentrites-backend:latest
    container_name: dentrites-ai-worker
    restart: always
    dns:
      - 8.8.8.8
      - 1.1.1.1
    command: npm run start:ai-worker
    environment:
      - REDIS_HOST=redis
      - LOKI_URL=http://loki:3100
      - GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcloud/adc.json
      - GOOGLE_CLOUD_PROJECT=nurons-project-502805
      - GOOGLE_CLOUD_LOCATION=us
    env_file:
      - ./backend/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./vertex-credentials.json:/tmp/gcloud/adc.json:ro
    depends_on:
      - redis
    deploy:
      resources:
        limits:
          cpus: "0.30"
          memory: 512M

  backend-cpu-worker:
    image: cjmatrix/dentrites-backend:latest
    container_name: dentrites-cpu-worker
    restart: always
    dns:
      - 8.8.8.8
      - 1.1.1.1
    command: npm run start:cpu-worker
    environment:
      - REDIS_HOST=redis
      - LOKI_URL=http://loki:3100
    env_file:
      - ./backend/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M

  nginx:
    image: nginx:alpine
    container_name: dentrites-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    command: '/bin/sh -c "while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g \"daemon off;\""'

  certbot:
    image: certbot/certbot
    container_name: dentrites-certbot
    restart: unless-stopped
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: 64M

volumes:
  prometheus-data:
  grafana-data:
  redis_data:
  loki-data:
